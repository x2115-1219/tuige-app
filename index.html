<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>推歌小站</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#f0f2f5;font-family:"微软雅黑",sans-serif;padding:15px 10px;}
        .top-nav{max-width:1200px;margin:0 auto 15px;display:flex;justify-content:space-between;align-items:center;}
        .site-title{font-size:24px;color:#222;}
        .filter-top-btn{padding:8px 16px;background:#6c5ce7;color:#fff;border:none;border-radius:20px;cursor:pointer;font-size:15px;}
        .filter-panel{max-height:0;overflow:hidden;transition:max-height 0.3s ease;background:#fff;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.05);max-width:1200px;margin:0 auto 15px;}
        .filter-panel.open{max-height:1200px;}
        .filter-content{padding:20px;}
        .filter-section{margin-bottom:18px;}
        .filter-section h4{margin-bottom:8px;color:#333;}
        .filter-buttons{display:flex;flex-wrap:wrap;gap:8px;}
        .filter-btn{padding:7px 14px;border:1px solid #ddd;border-radius:18px;background:#f5f5f5;cursor:pointer;font-size:14px;transition:0.2s;}
        .filter-btn.active{background:#6c5ce7;color:#fff;border-color:#6c5ce7;}
        .filter-actions{display:flex;gap:10px;justify-content:center;margin-top:15px;}
        .btn-apply{background:#27ae60;color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;}
        .btn-reset{background:#ff6b6b;color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;}
        .main-container{max-width:1200px;margin:0 auto 20px;display:grid;grid-template-columns:1fr 1fr;gap:15px;}
        .song-card{background:#fff;padding:25px;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.06);text-align:center;}
        .song-name{font-size:22px;font-weight:bold;color:#111;margin-bottom:6px;}
        .song-singer{font-size:16px;color:#666;margin-bottom:12px;}
        .song-desc{color:#444;line-height:1.6;margin-bottom:25px;}
        .btn-group{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
        .btn{padding:10px 16px;border:none;border-radius:10px;cursor:pointer;font-size:14px;}
        .btn-collect{background:#27ae60;color:#fff;}
        .btn-listen{background:#f39c12;color:#fff;}
        .btn-skip{background:#e74c3c;color:#fff;}
        .btn-block{background:#6c5ce7;color:#fff;}
        .platform-card{background:#fff;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center;padding:20px;}
        .platform-buttons{display:flex;flex-wrap:wrap;gap:15px;justify-content:center;}
        .platform-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:0.2s;}
        .platform-item:hover{transform:scale(1.05);}
        .platform-icon{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
        .icon-inner{width:100%;height:100%;}
        .platform-label{font-size:12px;color:#666;text-align:center;white-space:nowrap;}
        .douyin{background:#000;}
        .douyin-logo{width:100%;height:100%;background:linear-gradient(45deg,#25F4EE 25%,#FE2C55 75%);mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>') center / contain no-repeat;-webkit-mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>') center / contain no-repeat;}
        .qq{background:#12B7F5;}
        .qq-logo{width:100%;height:100%;background:#31C27C;mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>') center / contain no-repeat;-webkit-mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>') center / contain no-repeat;}
        .kugou{background:#3582F5;}
        .kugou-logo{width:100%;height:100%;background:#fff;mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>') center / contain no-repeat;-webkit-mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>') center / contain no-repeat;}
        .kuwo{background:#FF5722;}
        .kuwo-logo{width:100%;height:100%;background:#fff;mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1 1.93c-3.94-.49-7-3.85-7-7.93h2c0 3.31 2.69 6 6 6s6-2.69 6-6h2c0 4.08-3.06 7.44-7 7.93V19h4v2H8v-2h4v-3.07z"/></svg>') center / contain no-repeat;-webkit-mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1 1.93c-3.94-.49-7-3.85-7-7.93h2c0 3.31 2.69 6 6 6s6-2.69 6-6h2c0 4.08-3.06 7.44-7 7.93V19h4v2H8v-2h4v-3.07z"/></svg>') center / contain no-repeat;}
        .qishui{background:#00C88C;}
        .qishui-logo{width:100%;height:100%;background:#fff;mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>') center / contain no-repeat;-webkit-mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>') center / contain no-repeat;}
        .douyin-speed{background:#000;}
        .douyin-speed-logo{width:100%;height:100%;background:linear-gradient(45deg,#25F4EE 25%,#FE2C55 75%);mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>') center / contain no-repeat;-webkit-mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>') center / contain no-repeat;}
        .netease{background:#C20C0C;}
        .netease-logo{width:100%;height:100%;background:#fff;mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-.5 14.5v-5.3c-.55.25-1.2.4-1.9.4-1.7 0-3-1.3-3-3s1.3-3 3-3c1.6 0 2.9 1.3 3 2.9V13h2.5v2h-3.6z"/></svg>') center / contain no-repeat;-webkit-mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-.5 14.5v-5.3c-.55.25-1.2.4-1.9.4-1.7 0-3-1.3-3-3s1.3-3 3-3c1.6 0 2.9 1.3 3 2.9V13h2.5v2h-3.6z"/></svg>') center / contain no-repeat;}
        .collapsible-section{max-width:1200px;margin:0 auto 12px;background:#fff;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.05);overflow:hidden;}
        .section-header{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#f9f9f9;}
        .section-header h3{font-size:17px;color:#333;}
        .toggle-icon{transition:transform 0.3s ease;}
        .section-content{max-height:0;overflow:hidden;transition:max-height 0.3s ease;padding:0 20px;color:#555;line-height:1.8;}
        .collapsible-section.open .toggle-icon{transform:rotate(180deg);}
        .collapsible-section.open .section-content{max-height:500px;padding:15px 20px;}
        .black-tag{display:inline-block;padding:7px 14px;background:#eee;border-radius:18px;margin:4px;cursor:pointer;}
        .black-tag:hover{background:#ff6b6b;color:#fff;}
        @media(max-width:768px){.main-container{grid-template-columns:1fr;}.platform-icon{width:45px;height:45px;}.site-title{font-size:20px;}}
    </style>
</head>
<body>

<div class="top-nav">
    <h1 class="site-title">推歌小站</h1>
    <button class="filter-top-btn" onclick="toggleFilterPanel()">🎛️ 标签筛选</button>
</div>

<div class="filter-panel" id="filterPanel">
    <div class="filter-content">
        <h3>标签筛选（可多选）</h3>
        <div class="filter-section">
            <h4>场景</h4>
            <div class="filter-buttons">
                <button class="filter-btn" data-tag="工作">工作</button>
                <button class="filter-btn" data-tag="通勤">通勤</button>
                <button class="filter-btn" data-tag="校园">校园</button>
                <button class="filter-btn" data-tag="旅途">旅途</button>
                <button class="filter-btn" data-tag="咖啡馆">咖啡馆</button>
                <button class="filter-btn" data-tag="店铺">店铺</button>
                <button class="filter-btn" data-tag="清晨">清晨</button>
                <button class="filter-btn" data-tag="下午茶">下午茶</button>
                <button class="filter-btn" data-tag="夜晚">夜晚</button>
                <button class="filter-btn" data-tag="睡前">睡前</button>
                <button class="filter-btn" data-tag="派对">派对</button>
                <button class="filter-btn" data-tag="宅家">宅家</button>
                <button class="filter-btn" data-tag="车载">车载</button>
                <button class="filter-btn" data-tag="夜店">夜店</button>
                <button class="filter-btn" data-tag="婚礼">婚礼</button>
                <button class="filter-btn" data-tag="瑜伽">瑜伽</button>
                <button class="filter-btn" data-tag="做家务">做家务</button>
                <button class="filter-btn" data-tag="公共交通">公共交通</button>
                <button class="filter-btn" data-tag="茶馆">茶馆</button>
                <button class="filter-btn" data-tag="露营">露营</button>
            </div>
        </div>
        <div class="filter-section">
            <h4>语种</h4>
            <div class="filter-buttons">
                <button class="filter-btn" data-tag="国语">国语</button>
                <button class="filter-btn" data-tag="粤语">粤语</button>
                <button class="filter-btn" data-tag="英语">英语</button>
                <button class="filter-btn" data-tag="日文">日文</button>
                <button class="filter-btn" data-tag="韩语">韩语</button>
                <button class="filter-btn" data-tag="闽南语">闽南语</button>
            </div>
        </div>
        <div class="filter-section">
            <h4>风格</h4>
            <div class="filter-buttons">
                <button class="filter-btn" data-tag="港乐">港乐</button>
                <button class="filter-btn" data-tag="流行">流行</button>
                <button class="filter-btn" data-tag="摇滚">摇滚</button>
                <button class="filter-btn" data-tag="民谣">民谣</button>
                <button class="filter-btn" data-tag="电子">电子</button>
                <button class="filter-btn" data-tag="R&B">R&B</button>
                <button class="filter-btn" data-tag="爵士">爵士</button>
                <button class="filter-btn" data-tag="古风">古风</button>
                <button class="filter-btn" data-tag="国风">国风</button>
                <button class="filter-btn" data-tag="说唱">说唱</button>
                <button class="filter-btn" data-tag="乡村">乡村</button>
                <button class="filter-btn" data-tag="布鲁斯">布鲁斯</button>
                <button class="filter-btn" data-tag="拉丁">拉丁</button>
                <button class="filter-btn" data-tag="另类">另类</button>
                <button class="filter-btn" data-tag="独立">独立</button>
                <button class="filter-btn" data-tag="CityPop">CityPop</button>
                <button class="filter-btn" data-tag="Lofi">Lofi</button>
                <button class="filter-btn" data-tag="迪斯科">迪斯科</button>
                <button class="filter-btn" data-tag="雷鬼">雷鬼</button>
            </div>
        </div>
        <div class="filter-section">
            <h4>心情/氛围</h4>
            <div class="filter-buttons">
                <button class="filter-btn" data-tag="抒情">抒情</button>
                <button class="filter-btn" data-tag="慵懒">慵懒</button>
                <button class="filter-btn" data-tag="治愈">治愈</button>
                <button class="filter-btn" data-tag="遗憾">遗憾</button>
                <button class="filter-btn" data-tag="温柔">温柔</button>
                <button class="filter-btn" data-tag="怀旧">怀旧</button>
                <button class="filter-btn" data-tag="伤感">伤感</button>
                <button class="filter-btn" data-tag="安静">安静</button>
                <button class="filter-btn" data-tag="轻松">轻松</button>
                <button class="filter-btn" data-tag="甜蜜">甜蜜</button>
                <button class="filter-btn" data-tag="寂寞">寂寞</button>
                <button class="filter-btn" data-tag="感动">感动</button>
                <button class="filter-btn" data-tag="小清新">小清新</button>
                <button class="filter-btn" data-tag="励志">励志</button>
                <button class="filter-btn" data-tag="减压">减压</button>

                <button class="filter-btn" data-tag="空灵">空灵</button>
                <button class="filter-btn" data-tag="律动">律动</button>
            </div>
        </div>
        <div class="filter-actions">
            <button class="btn btn-apply" onclick="applyFilter()">✅ 确定筛选</button>
            <button class="btn btn-reset" onclick="resetFilter()">🔄 重置</button>
        </div>
    </div>
</div>

<div class="main-container">
    <div class="song-card">
        <div class="song-name" id="songName">歌曲加载中...</div>
        <div class="song-singer" id="songSinger"></div>
        <div class="song-desc" id="songDesc"></div>
        <div class="btn-group">
            <button class="btn btn-collect" onclick="collectSong()">✅ 收录歌单</button>
            <button class="btn btn-listen" onclick="listenOnly()">🎵 好听不收</button>
            <button class="btn btn-skip" onclick="skipSong()">❌ 直接跳过</button>
            <button class="btn btn-block" onclick="blockSinger()">🚫 屏蔽该歌手</button>
        </div>
    </div>

    <div class="platform-card">
        <div class="platform-buttons">
            <div class="platform-item" onclick="openDouyin()">
                <div class="platform-icon douyin"><div class="icon-inner"><div class="douyin-logo"></div></div></div>
                <span class="platform-label">抖音</span>
            </div>
            <div class="platform-item" onclick="openQQMusic()">
                <div class="platform-icon qq"><div class="icon-inner"><div class="qq-logo"></div></div></div>
                <span class="platform-label">QQ音乐</span>
            </div>
            <div class="platform-item" onclick="openKuGou()">
                <div class="platform-icon kugou"><div class="icon-inner"><div class="kugou-logo"></div></div></div>
                <span class="platform-label">酷狗</span>
            </div>
            <div class="platform-item" onclick="openKuWo()">
                <div class="platform-icon kuwo"><div class="icon-inner"><div class="kuwo-logo"></div></div></div>
                <span class="platform-label">酷我</span>
            </div>
            <div class="platform-item" onclick="openQiShui()">
                <div class="platform-icon qishui"><div class="icon-inner"><div class="qishui-logo"></div></div></div>
                <span class="platform-label">汽水音乐</span>
            </div>
            <div class="platform-item" onclick="openDouyinSpeed()">
                <div class="platform-icon douyin-speed"><div class="icon-inner"><div class="douyin-speed-logo"></div></div></div>
                <span class="platform-label">抖音极速版</span>
            </div>
            <div class="platform-item" onclick="openNetease()">
                <div class="platform-icon netease"><div class="icon-inner"><div class="netease-logo"></div></div></div>
                <span class="platform-label">网易云</span>
            </div>
        </div>
    </div>
</div>

<div class="collapsible-section">
    <div class="section-header" onclick="toggleSection('collectList')">
        <h3>📁 已收录歌单</h3>
        <span class="toggle-icon">▼</span>
    </div>
    <div class="section-content" id="collectList"></div>
</div>

<div class="collapsible-section">
    <div class="section-header" onclick="toggleSection('skipList')">
        <h3>🚫 已避雷跳过</h3>
        <span class="toggle-icon">▼</span>
    </div>
    <div class="section-content" id="skipList"></div>
</div>

<div class="collapsible-section">
    <div class="section-header" onclick="toggleSection('blacklist')">
        <h3>🔒 歌手黑名单（点击解除屏蔽）</h3>
        <span class="toggle-icon">▼</span>
    </div>
    <div class="section-content" id="blacklistBox"></div>
</div>

let collectList = JSON.parse(localStorage.getItem('collectList')) || [];
let skipList = JSON.parse(localStorage.getItem('skipList')) || [];
let blockedSingers = JSON.parse(localStorage.getItem('blockedSingers')) || [];
let usedSongIndex = JSON.parse(localStorage.getItem('usedSongIndex')) || [];
let selectedTags = [];

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        btn.classList.toggle('active');
        const tag = btn.dataset.tag;
        selectedTags.includes(tag) ? selectedTags = selectedTags.filter(t=>t!==tag) : selectedTags.push(tag);
    });
});

function toggleFilterPanel(){document.getElementById('filterPanel').classList.toggle('open');}
function toggleSection(id){document.getElementById(id).closest('.collapsible-section').classList.toggle('open');}
function getSearchKey(){const n=document.getElementById("songName").innerText;const s=document.getElementById("songSinger").innerText;return encodeURIComponent(`${n} ${s}`);}

function openDouyin(){location.href=`snssdk1128://search?keyword=${getSearchKey()}`;}
function openDouyinSpeed(){location.href=`snssdk2329://search?keyword=${getSearchKey()}`;}
function openQQMusic(){location.href=`qqmusic://search?key=${getSearchKey()}`;}
function openKuGou(){location.href=`kugou://search?keyword=${getSearchKey()}`;}
function openKuWo(){location.href=`kuwo://search?key=${getSearchKey()}`;}
function openQiShui(){location.href=`qishui://search?q=${getSearchKey()}`;}
function openNetease(){location.href=`orpheus://search?keyword=${getSearchKey()}`;}

function applyFilter(){toggleFilterPanel();usedSongIndex=[];localStorage.setItem('usedSongIndex',JSON.stringify(usedSongIndex));goNextRandom();}
function resetFilter(){selectedTags=[];document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));usedSongIndex=[];localStorage.setItem('usedSongIndex',JSON.stringify(usedSongIndex));goNextRandom();}

function loadCurrentSong(song){document.getElementById("songName").innerText=song.name;document.getElementById("songSinger").innerText=song.singer;document.getElementById("songDesc").innerText=song.desc;}

function getRandomSong(){
    let valid=songLibrary.filter((item,idx)=>{
        if(blockedSingers.includes(item.singer))return false;
        if(collectList.includes(`${item.name} - ${item.singer}`))return false;
        if(skipList.includes(`${item.name} - ${item.singer}`))return false;
        if(usedSongIndex.includes(idx))return false;
        if(selectedTags.length>0){let tags=item.desc.split(' ');for(let t of selectedTags)if(!tags.includes(t))return false;}
        return true;
    });
    if(!valid.length)return null;
    let rand=valid[Math.floor(Math.random()*valid.length)];
    let idx=songLibrary.findIndex(s=>s.name===rand.name&&s.singer===rand.singer);
    usedSongIndex.push(idx);localStorage.setItem('usedSongIndex',JSON.stringify(usedSongIndex));
    return rand;
}

function collectSong(){let s=getCurrentShowSong();if(!s)return;collectList.push(`${s.name} - ${s.singer}`);localStorage.setItem('collectList',JSON.stringify(collectList));renderList();goNextRandom();}
function listenOnly(){goNextRandom();}
function skipSong(){let s=getCurrentShowSong();if(!s)return;skipList.push(`${s.name} - ${s.singer}`);localStorage.setItem('skipList',JSON.stringify(skipList));renderList();goNextRandom();}
function blockSinger(){let s=getCurrentShowSong();if(!s)return;if(!blockedSingers.includes(s.singer)){blockedSingers.push(s.singer);localStorage.setItem('blockedSingers',JSON.stringify(blockedSingers));}renderBlackList();goNextRandom();}

function goNextRandom(){let song=getRandomSong();if(!song){document.getElementById("songName").innerText="当前筛选无更多歌曲";document.getElementById("songSinger").innerText="";document.getElementById("songDesc").innerText="请重置标签或更换筛选条件";return;}loadCurrentSong(song);}
function getCurrentShowSong(){let n=document.getElementById("songName").innerText;let s=document.getElementById("songSinger").innerText;return songLibrary.find(x=>x.name===n&&x.singer===s);}

function renderList(){document.getElementById("collectList").innerText=collectList.join(" ｜ ");document.getElementById("skipList").innerText=skipList.join(" ｜ ");}
function renderBlackList(){let box=document.getElementById('blacklistBox');box.innerHTML='';blockedSingers.forEach((item,idx)=>{let span=document.createElement('span');span.className='black-tag';span.innerText=item;span.onclick=()=>unBlockSinger(idx);box.appendChild(span);});}
function unBlockSinger(idx){blockedSingers.splice(idx,1);localStorage.setItem('blockedSingers',JSON.stringify(blockedSingers));renderBlackList();}

window.onload=function(){renderList();renderBlackList();goNextRandom();}
</script>
